[project]
name = "ksi-local-studio"
version = "2.0.0.dev0"
description = "Local-first media, document, translation, and creative AI studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lingua-language-detector>=2.2,<3",
    "numpy>=2,<3",
    "Pillow>=12,<13",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
ai = ["mlx-whisper>=0.4,<1"]

[project.scripts]
ksi = "ksi_local.cli:main"
ksi-gui = "ksi_local.gui:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
