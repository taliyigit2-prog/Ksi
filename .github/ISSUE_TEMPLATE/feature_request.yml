name: Feature request
description: Suggest a local-first improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Explain the problem without private content or account data.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Does it require network access?
      options: ["No", "Optional", "Yes"]
    validations:
      required: true

